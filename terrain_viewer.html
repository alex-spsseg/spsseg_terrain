<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrain Viewer</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0e1b33; }
  #map, #cmp { position: absolute; inset: 0; background: linear-gradient(180deg, #0b1630 0%, #1f4f82 7%, #7fb0d6 14%, #cfe3f0 21%); }
  #cmp { display: none; pointer-events: none; }
  #map.cmpon { background: transparent; }
  /* MapLibre listens for the mouse on this wrapper, which is normally zero height because its canvas is absolutely placed.
     The compare divider clips the canvas, and a clipped area cannot be hit, so make the wrapper fill the map itself. */
  #map .maplibregl-canvas-container { position: absolute; inset: 0; }
  #panel {
    position: absolute; z-index: 1000; top: 12px; left: 12px; width: 320px; max-width: calc(100% - 24px);
    max-height: calc(100% - 24px); overflow-y: auto;
    background: rgba(14, 27, 51, 0.92); color: #e8eef7; border: 1px solid #1b3f95; border-radius: 10px; padding: 14px;
  }
  #panel.collapsed .body { display: none; }
  #panel .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  #panel h1 { font-size: 16px; margin: 0 0 2px; color: #fff; }
  #panel .sub { font-size: 12px; color: #9fb2cc; margin-bottom: 4px; }
  #toggle { width: auto !important; margin: 0 !important; padding: 2px 9px !important; }
  #panel label { display: block; font-size: 12px; color: #9fb2cc; margin: 10px 0 3px; }
  #panel select, #panel button, #panel a.btn {
    display: block; width: 100%; background: #132447; color: #fff; border: 1px solid #1b3f95; border-radius: 6px; padding: 7px 8px;
    font-size: 13px; font-family: inherit; text-align: center; text-decoration: none;
  }
  #panel button, #panel a.btn { cursor: pointer; margin-top: 10px; }
  #panel button:hover, #panel select:hover, #panel a.btn:hover { border-color: #019fc4; }
  #panel input[type=range] { width: 100%; accent-color: #019fc4; }
  #panel .check { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; color: #e8eef7; font-size: 13px; }
  #panel .check input { width: auto; accent-color: #019fc4; }
  #panel .check.off { opacity: 0.45; }
  .rangehead { display: flex; justify-content: space-between; align-items: baseline; }
  .rangehead span { font-size: 12px; color: #e8eef7; }
  #panel .twobtn { display: flex; gap: 6px; }
  #panel .twobtn > * { flex: 1 1 0; }
  #panel .ovrow { margin: 12px 0 0; }
  #panel .ovrow .check { margin: 0; }
  #panel .ovrow input.ovop { display: block; width: calc(100% - 26px); margin: 4px 0 0 26px; height: 14px; }
  #panel .ovrow.dis .check { opacity: 0.5; }
  details.sec { margin-top: 10px; padding-top: 8px; border-top: 1px solid #1b3f95; }
  details.sec:first-of-type { margin-top: 4px; border-top: 0; padding-top: 0; }
  details.sec > summary { cursor: pointer; font-size: 13px; font-weight: 600; color: #fff; list-style: none; padding: 2px 0; user-select: none; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::before { content: '\25B8'; display: inline-block; width: 14px; color: #019fc4; }
  details.sec[open] > summary::before { content: '\25BE'; }
  details.sec > summary:hover { color: #5cc8dc; }
  .quick { display: flex; gap: 6px; margin-top: 8px; }
  .quick > * { flex: 1 1 0; margin-top: 0 !important; padding: 6px 4px !important; font-size: 12px !important; }
  #toolclear { color: #5cc8dc; cursor: pointer; display: none; font-size: 12px; margin-top: 6px; }
  #viewbar { position: absolute; z-index: 1000; top: 12px; left: 344px; align-items: center; gap: 8px; background: rgba(14,27,51,0.94); color: #fff;
    border: 1px solid #1b3f95; border-radius: 22px; padding: 4px 6px; font-size: 13px; }
  #viewbar button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #1b3f95; background: #132447; color: #fff; cursor: pointer; font-size: 12px; padding: 0; }
  #viewbar button:hover { border-color: #019fc4; }
  #viewlabel { min-width: 120px; max-width: 240px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #viewlabel small { color: #9fb2cc; margin-right: 6px; }
  @media (max-width: 700px) { #viewbar { top: auto; bottom: 16px; left: 50%; transform: translateX(-50%); } }
  #cloudleg { margin-top: 8px; }
  .dimtxt { color: #9fb2cc; font-size: 12px; }
  #panel .sec .check:first-of-type { margin-top: 8px; }
  #cloudlegbar { height: 8px; border-radius: 3px; background: linear-gradient(90deg, rgb(26,140,217), rgb(255,217,51), rgb(230,51,38)); border: 1px solid rgba(255,255,255,0.15); }
  #cloudleg .legrow { display: flex; justify-content: space-between; font-size: 11px; color: #9fb2cc; margin-top: 2px; }
  #busy { position: absolute; z-index: 1100; left: 50%; bottom: 14px; transform: translateX(-50%); background: rgba(14,27,51,0.92); color: #e8eef7;
    border: 1px solid #1b3f95; border-radius: 14px; padding: 4px 12px; font-size: 12px; display: none; pointer-events: none; }
  #panel button.on { border-color: #019fc4; background: #1b3f95; }
  #toolout { font-size: 12px; color: #e8eef7; line-height: 1.6; margin-top: 8px; }
  #toolout .dim { color: #9fb2cc; }
  #toolout b { color: #ffd23f; }
  #profile { position: absolute; z-index: 1000; left: 50%; transform: translateX(-50%); bottom: 24px; width: min(780px, calc(100% - 400px));
    background: rgba(14, 27, 51, 0.94); border: 1px solid #1b3f95; border-radius: 10px; padding: 8px 12px 10px; color: #e8eef7; }
  @media (max-width: 900px) { #profile { width: calc(100% - 24px); left: 12px; transform: none; bottom: 12px; } }
  #profhead { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #fff; gap: 8px; }
  #profhead .acts { display: flex; gap: 6px; }
  #profile .pbtn { background: #132447; color: #e8eef7; border: 1px solid #1b3f95; border-radius: 6px; padding: 3px 9px; font-size: 12px; cursor: pointer; font-family: inherit; }
  #profile .pbtn:hover { border-color: #019fc4; }
  #profcv { width: 100%; height: 190px; display: block; margin-top: 6px; cursor: crosshair; }
  #profread { font-size: 12px; color: #9fb2cc; min-height: 17px; margin-top: 4px; }
  .profdot { width: 12px; height: 12px; border-radius: 50%; background: #ffd23f; border: 2px solid #0e1b33; box-shadow: 0 0 0 1px #fff; pointer-events: none; }
  #panel input[type=text] { display: block; width: 100%; background: #0a1428; color: #fff; border: 1px solid #1b3f95; border-radius: 6px; padding: 7px 8px; font-size: 13px; font-family: inherit; margin-top: 8px; }
  #panel input[type=text]:focus { outline: none; border-color: #019fc4; }
  #defmsg { font-size: 11px; color: #7f93b0; margin-top: 6px; line-height: 1.4; }
  #viewmsg { font-size: 11px; color: #7f93b0; margin-top: 6px; line-height: 1.4; }
  #cmpwrap { margin-top: 12px; padding-top: 8px; border-top: 1px solid #1b3f95; }
  #cmpwrap .check { margin-top: 0; }
  #cmpdiv { position: absolute; z-index: 900; top: 0; bottom: 0; width: 16px; margin-left: -8px; cursor: ew-resize; display: none; touch-action: none; }
  #cmpdiv::before { content: ''; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 6px rgba(0,0,0,.6); }
  #cmpdiv .grip { position: absolute; left: -6px; top: 50%; width: 28px; height: 28px; margin-top: -14px; border-radius: 50%;
    background: #019fc4; border: 2px solid #fff; color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 6px rgba(0,0,0,.6); }
  .cmptag { position: absolute; z-index: 900; top: 14px; background: rgba(14,27,51,0.92); color: #e8eef7; border: 1px solid #1b3f95;
    border-radius: 6px; padding: 4px 9px; font-size: 12px; display: none; pointer-events: none; max-width: 40vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #floodbar { height: 10px; border-radius: 3px; margin: 10px 0 2px; border: 1px solid rgba(255,255,255,0.15); }
  #floodleg { display: flex; justify-content: space-between; font-size: 11px; color: #9fb2cc; }
  #note { margin-top: 10px; font-size: 11px; color: #7f93b0; line-height: 1.4; }
  #status { position: absolute; z-index: 1100; left: 50%; top: 14px; transform: translateX(-50%); max-width: min(90vw, 520px);
    background: rgba(14,27,51,0.92); color: #e8eef7; border: 1px solid #1b3f95; border-radius: 6px; padding: 6px 12px; font-size: 13px; display: none; text-align: center; }
  #err { position: absolute; z-index: 1101; inset: 36% 10% auto 10%; text-align: center; color: #e0a5a5; background: rgba(14,27,51,0.95);
    border: 1px solid #5a2a2a; border-radius: 8px; padding: 16px; display: none; font-size: 14px; line-height: 1.5; }
  #err a { color: #5cc8dc; }
  .stop { width: 16px; height: 16px; border-radius: 50%; padding: 0; background: #019fc4; border: 2px solid #fff; cursor: pointer;
    box-shadow: 0 0 0 1px rgba(0,0,0,.55), 0 1px 5px rgba(0,0,0,.6); }
  .stop:hover { background: #fff; border-color: #019fc4; }
  .stop.aerial { background: #ff9f1c; }
  .stop.float { background: #7fd4ff; }
  .maplibregl-popup-content { background: #132447; color: #e8eef7; border: 1px solid #1b3f95; border-radius: 8px; padding: 10px 28px 10px 12px;
    font-size: 12px; line-height: 1.5; box-shadow: 0 2px 10px rgba(0,0,0,.55); max-width: 260px; }
  .maplibregl-popup-content b { color: #fff; font-size: 13px; }
  .maplibregl-popup-content a { color: #5cc8dc; }
  .maplibregl-popup-close-button { color: #9fb2cc; font-size: 17px; }
  .maplibregl-popup-close-button:hover { background: none; color: #fff; }
  .maplibregl-popup-anchor-bottom .maplibregl-popup-tip, .maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip, .maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip { border-top-color: #132447; }
  .maplibregl-popup-anchor-top .maplibregl-popup-tip, .maplibregl-popup-anchor-top-left .maplibregl-popup-tip, .maplibregl-popup-anchor-top-right .maplibregl-popup-tip { border-bottom-color: #132447; }
  .maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color: #132447; }
  .maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color: #132447; }
  .maplibregl-ctrl-group { background: #132447; border: 1px solid #1b3f95; }
  .maplibregl-ctrl-group button + button { border-top: 1px solid #1b3f95; }
  .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: invert(1); }
  .maplibregl-ctrl-scale { background: rgba(14,27,51,0.8); color: #e8eef7; border-color: #9fb2cc; }
  .maplibregl-ctrl-attrib { background: rgba(14,27,51,0.8) !important; color: #9fb2cc; }
  .maplibregl-ctrl-attrib a { color: #9fb2cc; }
  @media (max-width: 700px) { #panel { width: 250px; } }
</style>
</head>
<body>
<div id="cmp"></div>
<div id="map"></div>
<div id="profile" style="display:none">
  <div id="profhead"><span id="proftitle">Cross section</span>
    <span class="acts"><button class="pbtn" id="profref" type="button">Clear reference</button><button class="pbtn" id="profcsv" type="button">Save CSV</button><button class="pbtn" id="profclose" type="button">&times;</button></span></div>
  <canvas id="profcv"></canvas>
  <div id="profread"></div>
</div>
<div id="cmpdiv"><div class="grip">&#9664;&#9654;</div></div>
<div class="cmptag" id="cmptagL"></div><div class="cmptag" id="cmptagR"></div>
<div id="status"></div>
<div id="err"></div>
<div id="panel">
  <div class="head">
    <div><h1 id="title">Terrain Viewer</h1><div class="sub" id="sub"></div></div>
    <button id="toggle" type="button" title="Show or hide controls">&#9776;</button>
  </div>
  <div class="body">
    <div class="quick"><button id="reset" type="button">Reset view</button><button id="orbit" type="button">Orbit</button><a class="btn" id="tourlink" href="#" target="_blank" rel="noopener" style="display:none">360 tour</a></div>

    <details class="sec" id="ovwrap" open>
      <summary id="ovhead">Layers</summary>
      <label class="check" id="stoprow"><input type="checkbox" id="stops" checked> 360 stops</label>
      <label class="check" id="cloudrow" style="display:none"><input type="checkbox" id="cloudon" checked> Point cloud <span id="cloudcount" class="dimtxt"></span></label>
      <div id="cmpwrap" style="display:none">
        <label class="check"><input type="checkbox" id="cmpon"> Compare two layers (drag the divider)</label>
        <div id="cmpsel" style="display:none">
          <label for="cmpL">Left side</label><select id="cmpL"></select>
          <label for="cmpR">Right side</label><select id="cmpR"></select>
        </div>
      </div>
    </details>

    <details class="sec" id="cloudwrap" style="display:none">
      <summary id="cloudhead">Point cloud style</summary>
      <label for="cloudmode">Color by</label>
      <select id="cloudmode"></select>
      <div id="cloudleg" style="display:none"><div id="cloudlegbar"></div><div class="legrow"><span>ground</span><span id="cloudlegmax"></span></div></div>
      <div class="rangehead"><label for="cloudsize">Point size</label><span id="cloudsizev">2 px</span></div>
      <input id="cloudsize" type="range" min="1" max="6" step="0.5" value="2">
      <label class="check" id="cloudgrow"><input type="checkbox" id="cloudhide" checked> Hide ground points</label>
      <div class="rangehead"><label for="cloudmin">Hide points lower than</label><span id="cloudminv">2 ft</span></div>
      <input id="cloudmin" type="range" min="0" max="10" step="0.5" value="2">
      <div class="rangehead"><label for="cloudz">Raise or lower the points</label><span id="cloudzv">0 ft</span></div>
      <input id="cloudz" type="range" min="-100" max="100" step="1" value="0">
    </details>

    <details class="sec" id="floodwrap" style="display:none">
      <summary id="floodhead">Flood depth</summary>
      <label class="check"><input type="checkbox" id="flood" checked> Show flood depth</label>
      <select id="floodsel" aria-label="Flood scenario"></select>
      <div class="rangehead"><label for="floodop">Depth opacity</label><span id="floodopv">80%</span></div>
      <input id="floodop" type="range" min="0" max="1" step="0.05" value="0.8">
      <div id="floodbar"></div>
      <div id="floodleg"><span>0 ft</span><span id="floodmax"></span></div>
    </details>

    <details class="sec" id="mapsec" open>
      <summary>Map and terrain</summary>
      <label for="base">Background imagery</label>
      <select id="base"></select>
      <label class="check"><input type="checkbox" id="t3d" checked> 3D terrain</label>
      <div id="exwrap">
        <div class="rangehead"><label for="ex">Vertical exaggeration</label><span id="exv"></span></div>
        <input id="ex" type="range" min="1" max="5" step="0.25" value="1.5">
      </div>
      <div class="rangehead"><label for="hs">Relief shading</label><span id="hsv"></span></div>
      <input id="hs" type="range" min="0" max="1" step="0.05" value="0.3">
      <label class="check"><input type="checkbox" id="dim" checked> Dim outside the mapped area</label>
    </details>

    <details class="sec" id="toolwrap">
      <summary id="toolhead">Measure</summary>
      <div class="twobtn" style="margin-top:6px"><button id="toolm" type="button">Height difference</button><button id="toolx" type="button">Cross section</button></div>
      <div id="toolout"></div>
      <div id="toolclear">Clear measurement</div>
    </details>

    <details class="sec" id="viewwrap" style="display:none">
      <summary id="viewhead">Saved views</summary>
      <select id="viewsel" aria-label="Saved views" style="margin-top:6px"></select>
      <div id="viewedit" style="display:none">
        <input type="text" id="viewname" placeholder="Name for this camera position" maxlength="60">
        <label class="check"><input type="checkbox" id="viewstart"> Open the site here</label>
        <div class="twobtn"><button id="viewsave" type="button">Save view</button><button id="viewdel" type="button">Delete</button></div>
        <div class="twobtn"><button id="viewup" type="button">Move earlier</button><button id="viewdown" type="button">Move later</button></div>
        <div id="viewmsg">Move the camera where you want it, name it, and press Save view. Publish to share it.</div>
      </div>
    </details>

    <details class="sec" id="setsec">
      <summary>Settings</summary>
      <label for="detail">Imagery detail</label>
      <select id="detail"><option value="1">Sharp (more tiles, slower)</option><option value="2">Fast (a quarter of the tiles)</option></select>
      <button id="savedef" type="button" style="display:none">Save this look as the site default</button>
      <div id="defmsg"></div>
    </details>
    <div id="note"></div>
  </div>
</div>
<div id="busy">Loading map tiles ...</div>
<div id="viewbar" style="display:none"><button id="viewprev" type="button" title="Previous view">&#9664;</button><span id="viewlabel"></span><button id="viewnext" type="button" title="Next view">&#9654;</button></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  function status(msg) { var s = $('status'); s.style.display = msg ? 'block' : 'none'; s.textContent = msg || ''; }
  function fail(html) { var e = $('err'); e.style.display = 'block'; e.innerHTML = html; status(''); }
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

  // which panel sections are open is remembered in this browser
  (function () {
    var key = 'terrainSections2', saved = null;
    try { saved = JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) {}
    var secs = document.querySelectorAll('details.sec');
    Array.prototype.forEach.call(secs, function (d) {
      if (saved && Object.prototype.hasOwnProperty.call(saved, d.id)) d.open = !!saved[d.id];
      d.addEventListener('toggle', function () {
        var st = {}; Array.prototype.forEach.call(secs, function (x) { st[x.id] = x.open; });
        try { localStorage.setItem(key, JSON.stringify(st)); } catch (e) {}
      });
    });
  })();

  var siteId = new URLSearchParams(location.search).get('site');
  var ESRI = { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', maxzoom: 19, attribution: 'Esri, Maxar, Earthstar Geographics' };
  var M_TO_FT = 1 / 0.3048006096012192;

  function start() {
    if (siteId) { load(siteId); return; }
    fetch('sites/_index.json', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('missing'); return r.json(); })
      .then(function (list) {
        if (list.length === 1) { siteId = list[0].site; load(siteId); return; }
        if (!list.length) { fail('Nothing has been built yet.'); return; }
        fail('Pick a site:<br>' + list.map(function (s) { return '<a href="?site=' + encodeURIComponent(s.site) + '">' + esc(s.title || s.site) + '</a>'; }).join('<br>'));
      })
      .catch(function () { fail('No site was given. Add ?site=name to the address.'); });
  }

  function load(id) {
    fetch('sites/' + encodeURIComponent(id) + '/manifest.json', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('Site "' + id + '" was not found.'); return r.json(); })
      .then(init)
      .catch(function (e) {
        fail(esc(e.message || String(e)) + (location.protocol === 'file:' ? '<br>This page has to be opened through a web address, not as a file. Run <b>python -m http.server</b> in this folder and open http://localhost:8000/terrain_viewer.html?site=' + esc(id) : ''));
      });
  }

  function init(M) {
    document.title = M.title + ' | Terrain Viewer';
    $('title').textContent = M.title;
    $('sub').textContent = M.description || '';
    var b = M.bounds4326;
    var siteBase = new URL('sites/' + encodeURIComponent(M.site) + '/', location.href).href;
    var demTiles = siteBase + 'dem/{z}/{x}/{y}.png';
    var relative = M.elevation_mode === 'relative';
    var exag = M.exaggeration || 1.5;
    $('ex').value = exag; $('exv').textContent = exag + 'x';
    $('hsv').textContent = '30%';
    $('note').textContent = relative
      ? 'Click the ground to read its height above the site\u2019s low point. Terrain is built from ' + (M.source && M.source.file ? M.source.file : 'the DTM') + '.'
      : 'Click the ground to read its elevation. Terrain is built from ' + (M.source && M.source.file ? M.source.file : 'the DTM') + '.';

    // imagery choices
    var prim = M.basemap || {};
    var primLabel = /google\./.test(prim.url || '') ? 'Google satellite' : 'Site imagery';
    var choices = [];
    if (prim.url) choices.push({ id: 'primary', label: primLabel, url: prim.url, maxzoom: 20, attribution: prim.attribution || '' });
    choices.push({ id: 'esri', label: 'Esri World Imagery', url: ESRI.url, maxzoom: ESRI.maxzoom, attribution: ESRI.attribution });
    choices.push({ id: 'none', label: 'Terrain shading only' });
    if (M.relief) choices.unshift({ id: 'relief', label: 'Shaded relief (elevation colors)', url: siteBase + 'relief/{z}/{x}/{y}.jpg', maxzoom: M.maxzoom, tileSize: 256, attribution: '', bounds: b });
    choices.forEach(function (c) { var o = document.createElement('option'); o.value = c.id; o.textContent = c.label; $('base').appendChild(o); });

    var pad = 0.04, dx = (b[2] - b[0]) * pad, dy = (b[3] - b[1]) * pad;
    var map = new maplibregl.Map({
      container: 'map',
      style: { version: 8, sources: {}, layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#0e1b33' } }] },
      center: [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2], zoom: 14, pitch: 60, bearing: -15,
      maxPitch: 82, minZoom: Math.max(8, M.minzoom - 1.5), maxBounds: [[b[0] - dx, b[1] - dy], [b[2] + dx, b[3] + dy]],
      attributionControl: { compact: true }
    });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');

          switched = true; $('base').value = 'esri'; setImagery('esri');
          status('The ' + primLabel + ' tiles did not load, so Esri imagery is showing instead.');
          setTimeout(function () { status(''); }, 6000);
        }
      }
    });
    status('Loading terrain...');
  }

  if (!window.maplibregl) { fail('The map library did not load. Check your connection and reload.'); } else { start(); }
})();
</script>
